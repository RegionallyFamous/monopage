name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Repo Checks And Packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli zip unzip

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "monopage-packages-${{ github.sha }}"
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14
